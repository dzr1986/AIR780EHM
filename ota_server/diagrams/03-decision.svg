<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="980" viewBox="0 0 980 980">
  <title>拉包决策</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .t { font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; font-size: 14px; fill: #1f2d3d; }
    .th { font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; font-size: 18px; font-weight: 700; fill: #1b3a5f; }
    .ts { font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; font-size: 12px; fill: #5a6a7a; }
    .tl { font-family: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; font-size: 11px; fill: #1b3a5f; }
  </style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5d6d"/>
  </marker>
</defs>
<text class="th" x="40" y="36">HTTP 拉包决策</text><text class="ts" x="40" y="56">GET /api/site/firmware_upgrade</text><rect x="360" y="80" width="260" height="48" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text class="t" x="490.0" y="109.0" text-anchor="middle"><tspan x="490.0" dy="0">GET firmware_upgrade</tspan></text>
<polygon points="490,150.0 600.0,190 490,230.0 380.0,190" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="194" text-anchor="middle"><tspan x="490" dy="0">项目 Key 存在?</tspan></text>
<rect x="720" y="170" width="180" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="810.0" y="197.0" text-anchor="middle"><tspan x="810.0" dy="0">26 无效项目</tspan></text>
<polygon points="490,260.0 600.0,300 490,340.0 380.0,300" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="304" text-anchor="middle"><tspan x="490" dy="0">IMEI 项目冲突?</tspan></text>
<rect x="720" y="280" width="180" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="810.0" y="307.0" text-anchor="middle"><tspan x="810.0" dy="0">25 无权限</tspan></text>
<polygon points="490,370.0 600.0,410 490,450.0 380.0,410" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="414" text-anchor="middle"><tspan x="490" dy="0">设备禁止升级?</tspan></text>
<rect x="80" y="390" width="180" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="170.0" y="417.0" text-anchor="middle"><tspan x="170.0" dy="0">&gt;=300</tspan></text>
<polygon points="490,480.0 600.0,520 490,560.0 380.0,520" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="524" text-anchor="middle"><tspan x="490" dy="0">固件名在库中?</tspan></text>
<rect x="720" y="500" width="180" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="810.0" y="527.0" text-anchor="middle"><tspan x="810.0" dy="0">27 无效固件</tspan></text>
<polygon points="490,585.0 610.0,630 490,675.0 370.0,630" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="626" text-anchor="middle"><tspan x="490" dy="0">源版本匹配</tspan><tspan x="490" dy="16">目标更高 / 指定设备</tspan></text>
<polygon points="490,720.0 600.0,760 490,800.0 380.0,760" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="764" text-anchor="middle"><tspan x="490" dy="0">文件&gt;0 字节?</tspan></text>
<rect x="80" y="740" width="180" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="170.0" y="767.0" text-anchor="middle"><tspan x="170.0" dy="0">404 空包</tspan></text>
<polygon points="490,830.0 610.0,870 490,910.0 370.0,870" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text class="ts" x="490" y="874" text-anchor="middle"><tspan x="490" dy="0">连续同目标&gt;=6?</tspan></text>
<rect x="80" y="850" width="200" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text class="t" x="180.0" y="877.0" text-anchor="middle"><tspan x="180.0" dy="0">禁止设备 &gt;=300</tspan></text>
<rect x="720" y="850" width="200" height="48" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text class="t" x="820.0" y="879.0" text-anchor="middle"><tspan x="820.0" dy="0">200 / 206 返回 bin</tspan></text>
<line x1="490" y1="128" x2="490" y2="150" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="600" y1="190" x2="720" y2="192" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="666.0" y="185.0">否</text>
<line x1="490" y1="230" x2="490" y2="260" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="239.0">是</text>
<line x1="600" y1="300" x2="720" y2="302" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="666.0" y="295.0">冲突</text>
<line x1="490" y1="340" x2="490" y2="370" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="349.0">否</text>
<line x1="380" y1="410" x2="260" y2="412" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="326.0" y="405.0">禁止</text>
<line x1="490" y1="450" x2="490" y2="480" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="459.0">允许</text>
<line x1="600" y1="520" x2="720" y2="522" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="666.0" y="515.0">否</text>
<line x1="490" y1="560" x2="490" y2="585" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="566.5">是</text>
<line x1="370" y1="630" x2="170" y2="412" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="276.0" y="515.0">否</text>
<line x1="490" y1="675" x2="490" y2="720" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="691.5">是</text>
<line x1="380" y1="760" x2="260" y2="762" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="326.0" y="755.0">否</text>
<line x1="490" y1="800" x2="490" y2="830" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="496.0" y="809.0">是</text>
<line x1="370" y1="870" x2="280" y2="872" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="331.0" y="865.0">是</text>
<line x1="610" y1="870" x2="720" y2="874" stroke="#4d5d6d" stroke-width="1.4" marker-end="url(#arr)"/><text class="tl" x="671.0" y="866.0">否</text>
</svg>