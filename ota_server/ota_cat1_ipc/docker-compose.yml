# 空库部署模板。公网地址用环境变量 OTA_PUBLIC_HOST（不要带 http://）。
# 不含现网设备/任务/固件升级数据。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: luat_ota
      MYSQL_USER: luat
      MYSQL_PASSWORD: luat123
    ports:
      - "127.0.0.1:3306:3306"
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ota-server:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/luat_ota?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: luat
      SPRING_DATASOURCE_PASSWORD: luat123
      LUAT_OTA_ADMIN_TOKEN: ${OTA_ADMIN_TOKEN:-ota-7f3a9c2e4b18d6a0e5c1}
      LUAT_OTA_LATEST_VERSION: "2034.001.003"
      LUAT_OTA_SEED_DEMO_DATA: "false"
      LUAT_MQTT_ENABLED: "true"
      LUAT_MQTT_HOST: "${MQTT_HOST:-112.86.146.218}"
      LUAT_MQTT_PORT: "${MQTT_PORT:-2123}"
      LUAT_MQTT_USERNAME: "${MQTT_USERNAME:-fptop1}"
      LUAT_MQTT_PASSWORD: "${MQTT_PASSWORD:-fptop1.com2025@#$&}"
      LUAT_MQTT_OTA_PUBLIC_BASE_URL: "http://${OTA_PUBLIC_HOST}"
      LUAT_OTA_IPC_FILE_DIR: /var/www/fileserver
      LUAT_OTA_IPC_DEMO_BASE: http://ipc-x86demo:8010
      LUAT_OTA_IPC_PUBLIC_DOWNLOAD_BASE: "http://${OTA_PUBLIC_HOST}:8008"
    volumes:
      - ./firmware:/app/firmware
      - ./logs:/app/logs
      - ./ipc_upgrade/files:/var/www/fileserver
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - ota-server
      - ipc-x86demo
    ports:
      - "80:80"
      - "443:443"
      - "8008:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/ota.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./ipc_upgrade/files:/var/www/fileserver:ro
    restart: unless-stopped

  ipc-x86demo:
    build: ./ipc_upgrade/x86demo
    environment:
      DEVICE_ID: T31-X86-DEMO
      FIRMWARE_NAME: T31_IPC
      VERSION: "1.0.0"
      PUBLIC_BASE: "http://${OTA_PUBLIC_HOST}"
      PUBLIC_DOWNLOAD_BASE: "http://${OTA_PUBLIC_HOST}:8008"
      INTERNAL_DOWNLOAD_BASE: http://nginx
      INTERNAL_DOWNLOAD_8008: http://nginx:8008
      FILE_DIR: /var/www/fileserver
      SLOT_DIR: /app/slot
    volumes:
      - ./ipc_upgrade/files:/var/www/fileserver
      - ./ipc_upgrade/slot:/app/slot
    expose:
      - "8010"
    restart: unless-stopped

volumes:
  mysql_data:
