# 公网 IP 部署：80 直接反代（设备 libfota2 走 HTTP）
# 443 提供自签 HTTPS，便于浏览器管理台访问
# /admin/api/v1/ 是报警视频 uploadVideo（host 7003），与 OTA /admin/api 分开
# /downloads 与 :8008 是 IPC 固件 HTTP 文件服务（ipc_upgrade FileUrl）
server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    location /downloads/ {
        alias /var/www/fileserver/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /ipc_upgrade/ {
        client_max_body_size 64m;
        proxy_pass http://ipc-x86demo:8010/ipc_upgrade/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    location /admin/api/v1/ {
        client_max_body_size 400m;
        proxy_pass http://host.docker.internal:7003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://ota-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;

    location /downloads/ {
        alias /var/www/fileserver/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /ipc_upgrade/ {
        client_max_body_size 64m;
        proxy_pass http://ipc-x86demo:8010/ipc_upgrade/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    location /admin/api/v1/ {
        client_max_body_size 400m;
        proxy_pass http://host.docker.internal:7003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://ota-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 对齐 pack_tool：真机 ipc.json.url = http://IP:8008/downloads/ipc.tar
server {
    listen 8008;
    server_name _;

    location /downloads/ {
        alias /var/www/fileserver/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }
}
